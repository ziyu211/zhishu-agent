name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 测试在 backend/ 目录下运行（test 文件与 zhishu 包均位于此）
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run e2e suite
        run: python tests/run_e2e.py --verbose
        env:
          # 允许使用默认密钥启动（e2e 用同源密钥自签 token，无需真实凭据）
          ZHISHU_ALLOW_INSECURE_DEFAULTS: "1"
